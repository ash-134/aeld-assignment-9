name: assignment-test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  full-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ruby

      - name: Run verification and compile checks
        run: |
          if [ -f "./unit-test.sh" ]; then ./unit-test.sh; fi
          make -C server clean && make -C server && make -C server clean
          echo "Assignment 9 build and tests passed successfully!"
